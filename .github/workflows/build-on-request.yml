name: Diagnose OTCv8 Android Legacy SDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Android:
    name: Diagnose Android Ant dependencies (no build)
    runs-on: windows-2022
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android SDK
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = $env:ANDROID_HOME
          if (!$sdkRoot) { $sdkRoot = $env:ANDROID_SDK_ROOT }
          if (!$sdkRoot) { throw "Android SDK path not found" }
          if (!(Test-Path $sdkRoot)) { throw "SDK directory missing: $sdkRoot" }
          "OTCV8_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Android SDK: $sdkRoot"

      - name: Download and extract legacy Android SDK Tools
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://dl.google.com/android/repository/tools_r25.2.5-windows.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "android-tools-legacy.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "android-tools-legacy"

          Write-Host "===== DOWNLOAD LEGACY SDK TOOLS ====="
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Write-Host "Downloaded bytes: $((Get-Item $zipPath).Length)"

          Write-Host "===== EXTRACT LEGACY SDK TOOLS ====="
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          Write-Host "===== ARCHIVE ROOT CONTENTS ====="
          Get-ChildItem -Path $extractPath | Select-Object Name, FullName | Format-Table -AutoSize

          Write-Host "===== FIND LEGACY ANT BUILD.XML ====="
          $antBuilds = @(Get-ChildItem -Path $extractPath -Filter "build.xml" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]ant[\\/]build\.xml$' })
          $antBuilds | Select-Object FullName | Format-Table -AutoSize
          if ($antBuilds.Count -eq 0) { throw "Legacy Android Ant build.xml not found in archive" }

          $sourceTools = Split-Path (Split-Path $antBuilds[0].FullName -Parent) -Parent
          $targetTools = Join-Path $env:OTCV8_SDK_ROOT "tools"
          Write-Host "Source tools directory: $sourceTools"
          Write-Host "Target tools directory: $targetTools"

          New-Item -ItemType Directory -Path $targetTools -Force | Out-Null
          Copy-Item -Path (Join-Path $sourceTools '*') -Destination $targetTools -Recurse -Force

          "OTCV8_LEGACY_EXTRACT=$extractPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Legacy tools copied"

      - name: Diagnose legacy Android Ant dependencies
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = $env:OTCV8_SDK_ROOT
          $toolsPath = Join-Path $sdkRoot "tools"

          Write-Host "===== SDK TOOLS DIRECTORY ====="
          if (Test-Path $toolsPath) {
            Get-ChildItem -Path $toolsPath | Select-Object Name, FullName | Format-Table -AutoSize
          } else {
            Write-Host "SDK tools directory does not exist"
          }

          Write-Host "===== SEARCH ANT DEPENDENCIES ====="
          Get-ChildItem -Path $toolsPath -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'anttasks|emma|sdklib|sdkmanager|\.jar$' } |
            Select-Object FullName, Length | Format-Table -AutoSize

          Write-Host "===== CHECK LEGACY PATHS ====="
          foreach ($relativePath in @(
            'tools\ant\build.xml',
            'tools\lib',
            'tools\lib\anttasks.jar',
            'tools\lib\sdklib.jar'
          )) {
            $path = Join-Path $sdkRoot $relativePath
            Write-Host "${relativePath}: $(Test-Path $path)"
          }

          Write-Host "===== LEGACY PACKAGE CONTENTS ====="
          Get-ChildItem -Path $env:OTCV8_LEGACY_EXTRACT -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'anttasks|emma|sdklib|build\.xml|\.jar$' } |
            Select-Object FullName, Length | Format-Table -AutoSize

          Write-Host "===== ANT HOME ====="
          Write-Host "ANT_HOME=$env:ANT_HOME"
          Write-Host "===== DIAGNOSIS COMPLETE - BUILD DISABLED ====="
