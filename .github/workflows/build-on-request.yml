name: Diagnose OTCv8 Android Legacy SDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Android:
    name: Test Android Ant dependencies (no build)
    runs-on: windows-2022
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android SDK and Ant
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = $env:ANDROID_HOME
          if (!$sdkRoot) { $sdkRoot = $env:ANDROID_SDK_ROOT }
          if (!$sdkRoot -or !(Test-Path $sdkRoot)) { throw "Android SDK directory not found" }
          $antHome = $env:ANT_HOME
          if (!$antHome) { throw "ANT_HOME is not defined" }
          $antExe = Join-Path $antHome 'bin\ant.bat'
          if (!(Test-Path $antExe)) { throw "Ant executable not found: $antExe" }
          "OTCV8_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OTCV8_ANT_EXE=$antExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Android SDK: $sdkRoot"
          & $antExe -version
          if ($LASTEXITCODE -ne 0) { throw "Ant could not start" }

      - name: Download and extract legacy Android SDK Tools
        run: |
          $ErrorActionPreference = "Stop"
          $url = 'https://dl.google.com/android/repository/tools_r25.2.5-windows.zip'
          $zipPath = Join-Path $env:RUNNER_TEMP 'android-tools-legacy.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'android-tools-legacy'
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          $antBuilds = @(Get-ChildItem -Path $extractPath -Filter 'build.xml' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]ant[\\/]build\.xml$' })
          if ($antBuilds.Count -eq 0) { throw 'Legacy Android Ant build.xml not found' }
          $sourceTools = Split-Path (Split-Path $antBuilds[0].FullName -Parent) -Parent
          $targetTools = Join-Path $env:OTCV8_SDK_ROOT 'tools'
          New-Item -ItemType Directory -Path $targetTools -Force | Out-Null
          Copy-Item -Path (Join-Path $sourceTools '*') -Destination $targetTools -Recurse -Force
          Write-Host "Legacy tools copied from $sourceTools"

      - name: Verify Ant JAR contents and run task smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = $env:OTCV8_SDK_ROOT
          $toolsLib = Join-Path $sdkRoot 'tools\lib'
          $antJar = Join-Path $toolsLib 'ant-tasks.jar'
          $emmaJar = Join-Path $toolsLib 'emma_ant.jar'
          foreach ($file in @($antJar, $emmaJar)) {
            if (!(Test-Path $file)) { throw "Missing required JAR: $file" }
            Write-Host "Found $file"
          }

          Write-Host '===== INSPECT JAR RESOURCES ====='
          $jarExe = Join-Path $env:JAVA_HOME 'bin\jar.exe'
          if (!(Test-Path $jarExe)) { $jarExe = 'jar.exe' }
          foreach ($file in @($antJar, $emmaJar)) {
            Write-Host "JAR: $file"
            & $jarExe tf $file | Select-String -Pattern 'anttasks\.properties|emma_ant\.properties|CheckEnv|checkenv' | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $file" }
          }

          Write-Host '===== TEST ANT TASK LOADING ====='
          $testDir = Join-Path $env:RUNNER_TEMP 'ant-smoke-test'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          $testBuild = Join-Path $testDir 'build.xml'
          $antJarXml = [System.Security.SecurityElement]::Escape($antJar)
          $emmaJarXml = [System.Security.SecurityElement]::Escape($emmaJar)
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <project name="android-ant-smoke-test" default="verify">
            <taskdef resource="anttasks.properties" classpath="$antJarXml" />
            <taskdef resource="emma_ant.properties" classpath="$emmaJarXml" />
            <target name="verify">
              <echo message="Android Ant task definitions loaded" />
              <echo message="checkenv task registered successfully" />
            </target>
          </project>
          "@ | Set-Content -Path $testBuild -Encoding utf8
          & $env:OTCV8_ANT_EXE -f $testBuild verify -verbose
          if ($LASTEXITCODE -ne 0) { throw 'Android Ant task loading failed' }
          Write-Host '===== ANT TASK TEST PASSED; NATIVE BUILD REMAINS DISABLED ====='
