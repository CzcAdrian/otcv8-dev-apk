name: Tibia 860 private-network clients
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [both, windows, android]
        default: both
permissions:
  contents: read
concurrency:
  group: tibia860-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  windows:
    if: inputs.platform != 'android'
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /vc16/
            /ci/
            /docs/TIBIA860.md
            /modules/
            /layouts/
            /mods/
            /data/
            !/data/things/
            /init.lua
            /LICENSE
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: win32-static-vcpkg-01f602195983451bc83e72f4214af2cbc495aa94
      - name: Install pinned native dependencies
        env:
          VCPKG_MAX_CONCURRENCY: '2'
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout 01f602195983451bc83e72f4214af2cbc495aa94
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES="clear;files,$((Resolve-Path .vcpkg-cache).Path),readwrite"
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install --triplet x86-windows-static --x-install-root="$env:RUNNER_TEMP/installed" boost-iostreams boost-asio boost-beast boost-system boost-variant boost-lockfree boost-process boost-program-options boost-uuid boost-filesystem luajit glew physfs openal-soft libogg libvorbis zlib libzip bzip2 openssl liblzma
          if ($LASTEXITCODE) { throw 'Dependency build failed' }
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" integrate install
      - name: Build portable Windows executable
        run: |
          msbuild vc16/otclient.vcxproj /m:2 /p:Configuration=OpenGL /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:VcpkgInstalledDir="$env:RUNNER_TEMP/installed/" /p:VcpkgRoot="$env:RUNNER_TEMP/vcpkg/" /p:BUILD_REVISION=${{ github.run_number }} /verbosity:minimal
          if ($LASTEXITCODE) { throw 'Windows compilation failed' }
          python ci/package.py --output dist/Tibia860-Windows.zip --exe otclient_gl.exe
          if ($LASTEXITCODE) { throw 'Packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Tibia860-Windows
          path: dist/Tibia860-Windows.zip
          if-no-files-found: error
          retention-days: 14
  android:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /ci/
            /android/
            /android-modern/
            /android_libs.7z
            /docs/TIBIA860.md
            /modules/
            /layouts/
            /mods/
            /data/
            !/data/things/
            /init.lua
            /LICENSE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare SDK and reusable ARM64 dependencies
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          mkdir -p "$RUNNER_TEMP/android-deps"
          7z x android_libs.7z -o"$RUNNER_TEMP/android-deps" >/dev/null
          include=$(find "$RUNNER_TEMP/android-deps" -path '*/include/lua.h' -o -path '*/include/luajit/lua.h' | head -1)
          root=$(find "$RUNNER_TEMP/android-deps" -type d -name lib64 | head -1)
          test -n "$root"
          echo "ANDROID_DEPS=$(dirname "$root")" >> "$GITHUB_ENV"
          python3 ci/package.py --output android/otclientv8/assets/data.zip
      - name: Build Android ARM64 APK
        working-directory: android-modern
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug
      - name: Verify ARM64 and 16 KiB ELF alignment
        run: |
          mkdir -p dist verify
          cp android-modern/app/build/outputs/apk/debug/app-debug.apk dist/Tibia860-Android-arm64.apk
          unzip -q dist/Tibia860-Android-arm64.apk 'lib/*' -d verify
          python3 ci/check-android-elf.py verify/lib
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/Tibia860-Android-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 dist/Tibia860-Android-arm64.apk > dist/apk-alignment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Tibia860-Android-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14
